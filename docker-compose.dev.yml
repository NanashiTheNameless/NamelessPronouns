services:
  app:
    build:
      context: .
      target: operations
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      SECURE_COOKIES: "false"
      MAIL_DEV_LOG: "true"
      DB_BACKEND: postgres
    command: ["sh", "-c", "node scripts/migrate.js && exec node src/server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: namelesspronouns
      POSTGRES_USER: namelesspronouns
    volumes:
      - pronouns-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namelesspronouns -d namelesspronouns"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
volumes:
  pronouns-postgres:
    name: pronouns-postgres
networks:
  internal:
    driver: bridge
