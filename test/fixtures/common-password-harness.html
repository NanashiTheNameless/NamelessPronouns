<!doctype html><html><body>
<form data-common-password-check><input name="password" type="password"><p data-common-password-message></p><button>Continue</button></form>
<output id="browser-result">pending</output>
<script src="/static/js/common-password.js"></script>
<script>
  (async () => {
    const form = document.querySelector('form');
    form.querySelector('input').value = 'g00dPa$$w0rD';
    form.requestSubmit();
    await new Promise((resolve) => setTimeout(resolve, 800));
    const input = form.querySelector('input');
    const output = document.querySelector('#browser-result');
    output.textContent = document.querySelector('[data-common-password-message]').textContent;
    output.dataset.nativeValidationMessage = input.validationMessage;
    output.dataset.ariaInvalid = input.getAttribute('aria-invalid') || '';
  })();
</script></body></html>
