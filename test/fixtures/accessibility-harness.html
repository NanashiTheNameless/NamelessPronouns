<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessibility harness</title>
  <script>
    if (!sessionStorage.getItem('seeded')) {
      localStorage.setItem('np-accessibility-theme', 'contrast');
      localStorage.setItem('np-accessibility-font', 'serif');
      sessionStorage.setItem('seeded', '1');
      location.reload();
    }
  </script>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/accessibility.js"></script>
  <script>
    window.earlyApply = {
      theme: document.documentElement.getAttribute('data-theme'),
      font: document.documentElement.getAttribute('data-font'),
      beforeBody: document.body === null,
    };
  </script>
</head>
<body>
  <h1 data-owner-heading>Owner Example</h1>
  <span data-owner-badge>Owner</span><span data-owner-tooltip>wrote this bit</span>
  <footer-slot></footer-slot>
  <output id="browser-result">pending</output>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const root = document.documentElement;
    const dialog = document.querySelector('[data-accessibility-panel]');
    const open = document.querySelector('[data-accessibility-open]');
    const status = () => dialog.querySelector('[data-accessibility-status]').textContent;
    const inline = (property) => root.style.getPropertyValue(property);
    const pick = (name, value) => dialog.querySelector(`input[name="${name}"][value="${value}"]`).click();
    const typeInto = (selector, value) => {
      const field = dialog.querySelector(selector);
      field.value = value;
      field.dispatchEvent(new Event('input', { bubbles: true }));
    };
    const clickAction = (action) => dialog.querySelector(`[data-accessibility-${action}]`).click();
    const toast = document.querySelector('[data-easter-status]');
    const toastState = () => ({
      message: toast.textContent,
      visible: toast.classList.contains('is-visible'),
      topLayer: toast.matches(':popover-open'),
    });
    const colorsHidden = () => dialog.querySelector('[data-accessibility-colors]').hidden
      && getComputedStyle(dialog.querySelector('[data-accessibility-colors]')).display === 'none';

    const seededFont = getComputedStyle(document.body).fontFamily;
    const buttonHidden = open.hidden;
    open.click();
    const openedState = dialog.open;
    const openedWithStoredChecked = dialog.querySelector('input[name="accessibility_theme"]:checked').value;
    const konamiInitiallyHidden = dialog.querySelector('[data-konami-theme]').hidden;
    const ownerBusinessCard = { ...window.NamelessNanashi };
    const ownerBusinessCardText = window.NamelessNanashi.toString();
    const ownerFix = window.NamelessNanashi.fix();
    const ownerHelp = window.NamelessNanashi.help();
    clickAction('copy');
    clickAction('copy');
    clickAction('copy');
    await new Promise((resolve) => setTimeout(resolve, 0));
    const backupBackup = status();

    pick('accessibility_theme', 'light');
    pick('accessibility_font', 'sans');
    const light = {
      theme: root.getAttribute('data-theme'),
      font: root.getAttribute('data-font'),
      stored: [localStorage.getItem('np-accessibility-theme'), localStorage.getItem('np-accessibility-font')],
      background: getComputedStyle(document.body).backgroundColor,
      color: getComputedStyle(document.body).color,
      colorsHidden: colorsHidden(),
    };

    pick('accessibility_theme', 'contrast');
    const contrastDark = { theme: root.getAttribute('data-theme'), accent: getComputedStyle(root).getPropertyValue('--accent').trim(), colorsHidden: colorsHidden() };
    pick('accessibility_theme', 'contrast-light');
    const contrastLight = { theme: root.getAttribute('data-theme'), accent: getComputedStyle(root).getPropertyValue('--accent').trim(), colorsHidden: colorsHidden() };

    pick('accessibility_theme', 'custom');
    pick('accessibility_font', 'custom');
    const sectionsShown = {
      colors: dialog.querySelector('[data-accessibility-colors]').hidden === false,
      family: dialog.querySelector('[data-accessibility-family]').hidden === false,
    };
    typeInto('[name="accessibility_color_bg"]', '#102030');
    typeInto('[name="accessibility_color_bg"]', '#c0ffee');
    const colorQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#deface');
    const defaceQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#123456');
    const orderedColorQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#777777');
    const luckyColorQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#abcdef');
    const alphabeticalColorQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#102030');
    typeInto('[name="accessibility_color_text"]', '#f0f4ff');
    typeInto('[name="accessibility_color_bg"]', '#000000');
    typeInto('[name="accessibility_color_text"]', '#ffffff');
    const monochromeQuip = status();
    typeInto('[name="accessibility_color_text"]', '#000000');
    const stealthQuip = status();
    typeInto('[name="accessibility_color_bg"]', '#102030');
    typeInto('[name="accessibility_color_text"]', '#f0f4ff');
    typeInto('[name="accessibility_font_family"]', 'Georgia, serif');
    typeInto('[name="accessibility_font_family"]', 'Comic Sans MS');
    const fontQuip = status();
    typeInto('[name="accessibility_font_family"]', 'Times New Roman');
    const timesQuip = status();
    typeInto('[name="accessibility_font_family"]', '0xProto');
    const defaultFontQuip = status();
    typeInto('[name="accessibility_font_family"]', 'Papyrus');
    const papyrusQuip = status();
    typeInto('[name="accessibility_font_family"]', 'Georgia, serif');
    const custom = {
      inlineBg: inline('--bg'),
      inlineText: inline('--text'),
      inlineFont: inline('--font-body'),
      colorScheme: root.style.colorScheme,
      background: getComputedStyle(document.body).backgroundColor,
      fontFamily: getComputedStyle(document.body).fontFamily,
      contrastNote: dialog.querySelector('[data-accessibility-contrast]').textContent,
      exported: dialog.querySelector('[data-accessibility-transfer]').value,
    };

    const picker = dialog.querySelector('[data-color-picker="accent"]');
    picker.value = '#3311aa';
    picker.dispatchEvent(new Event('input', { bubbles: true }));
    const picked = {
      inlineAccent: inline('--accent'),
      textField: dialog.querySelector('[name="accessibility_color_accent"]').value,
      pickerAfterTyping: (() => {
        typeInto('[name="accessibility_color_accent"]', '#204020');
        return dialog.querySelector('[data-color-picker="accent"]').value;
      })(),
    };

    typeInto('[name="accessibility_color_bg"]', 'not-a-color');
    const rejected = { message: status(), inlineBg: inline('--bg') };
    typeInto('[name="accessibility_color_bg"]', '#decade');
    const decade = { message: status(), inlineBg: inline('--bg') };
    typeInto('[name="accessibility_color_bg"]', '#102030');

    typeInto('[name="accessibility_font_family"]', 'url(https://evil.example/f.woff)');
    const rejectedFamily = { message: status(), inlineFont: inline('--font-body') };
    typeInto('[name="accessibility_font_family"]', 'Georgia, serif');

    typeInto('[data-accessibility-transfer]', JSON.stringify({
      version: 1,
      theme: 'custom',
      font: 'custom',
      colors: { bg: '#204020', text: '#ffffff', accent: 'javascript:alert(1)' },
      fontFamily: 'Verdana, sans-serif',
    }));
    clickAction('import');
    const imported = {
      message: status(),
      inlineBg: inline('--bg'),
      inlineAccent: inline('--accent'),
      inlineFont: inline('--font-body'),
      stored: localStorage.getItem('np-accessibility-colors'),
    };

    typeInto('[data-accessibility-transfer]', 'not json at all');
    clickAction('import');
    const badImport = { message: status(), inlineBg: inline('--bg') };

    typeInto('[data-accessibility-transfer]', JSON.stringify({
      version: 1998,
      theme: 'default',
      font: 'default',
      colors: {},
      fontFamily: '',
    }));
    clickAction('import');
    const timeMachine = {
      message: status(),
      theme: root.getAttribute('data-theme'),
      unlocked: localStorage.getItem('np-accessibility-konami'),
      revealed: dialog.querySelector('[data-konami-theme]').hidden === false,
    };

    const pasteAndApply = (value) => {
      const field = dialog.querySelector('[data-accessibility-transfer]');
      field.focus();
      field.value = value;
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.dispatchEvent(new Event('change', { bubbles: true }));
      field.blur();
      clickAction('import');
    };
    pasteAndApply(JSON.stringify({ version: 1, theme: 'light', font: 'serif', colors: {}, fontFamily: '' }));
    const pasted = { message: status(), theme: root.getAttribute('data-theme'), stored: localStorage.getItem('np-accessibility-theme') };

    clickAction('reset');
    const reset = {
      theme: root.getAttribute('data-theme'),
      font: root.getAttribute('data-font'),
      stored: [localStorage.getItem('np-accessibility-theme'), localStorage.getItem('np-accessibility-font')],
      checked: dialog.querySelector('input[name="accessibility_theme"]:checked').value,
      inlineBg: inline('--bg'),
      inlineFont: inline('--font-body'),
      storedColors: localStorage.getItem('np-accessibility-colors'),
      storedFamily: localStorage.getItem('np-accessibility-font-family'),
      colorsHidden: colorsHidden(),
    };
    clickAction('reset');
    const doubleReset = status();

    clickAction('close');
    const closedState = dialog.open;
    for (const key of ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']) {
      document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    }
    const konami = {
      initiallyHidden: konamiInitiallyHidden,
      unlocked: dialog.querySelector('[data-konami-theme]').hidden === false,
      stored: localStorage.getItem('np-accessibility-konami'),
    };
    const konamiToast = toastState();
    for (const key of ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']) {
      document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    }
    const konamiEncore = status();
    const konamiEncoreToast = toastState();
    open.click();
    pick('accessibility_theme', '1998');
    const retroTheme = root.getAttribute('data-theme');
    clickAction('close');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: '?', shiftKey: true, bubbles: true }));
    const shortcuts = document.querySelector('[data-shortcuts-panel]');
    const shortcutsOpened = shortcuts.open;
    document.dispatchEvent(new KeyboardEvent('keydown', { key: '?', shiftKey: true, bubbles: true }));
    const shortcutInception = shortcuts.querySelector('h2').textContent;
    shortcuts.querySelector('[data-shortcuts-close]').click();
    for (const key of [...'nanashi']) document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    const ownerSequence = document.querySelector('[data-easter-status]').textContent;
    const ownerSequenceToast = toastState();
    for (const key of [...'whoami']) document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    const whoamiToast = toastState();
    for (const key of [...'help']) document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    const helpToast = toastState();
    const ownerSignature = document.querySelector('[data-owner-signature]');
    for (let index = 0; index < 7; index += 1) ownerSignature.click();
    const footerPersistence = ownerSignature.closest('p').textContent.replace(/\s+/g, ' ').trim();
    const footerPersistenceToast = toastState();
    const ownerHeading = document.querySelector('[data-owner-heading]');
    for (let index = 0; index < 7; index += 1) ownerHeading.click();
    const ownerHeadingEncore = ownerHeading.textContent;
    const ownerHeadingToast = toastState();
    window.dispatchEvent(new Event('offline'));
    const offlineToast = toastState();
    window.dispatchEvent(new Event('online'));
    const onlineToast = toastState();
    const ownerBadge = document.querySelector('[data-owner-badge]');
    for (let index = 0; index < 5; index += 1) ownerBadge.dispatchEvent(new MouseEvent('mouseenter'));
    const ownerBadgeEncore = ownerBadge.nextElementSibling.textContent;
    for (const key of ['4', '2']) document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    const fortyTwo = document.querySelector('[data-easter-status]').textContent;
    const fortyTwoToast = toastState();
    document.getElementById('browser-result').textContent = JSON.stringify({
      early: window.earlyApply,
      seededFont,
      buttonHidden,
      openedState,
      closedState,
      openedWithStoredChecked,
      light,
      picked,
      contrastDark,
      contrastLight,
      sectionsShown,
      custom,
      rejected,
      decade,
      rejectedFamily,
      imported,
      pasted,
      badImport,
      timeMachine,
      reset,
      doubleReset,
      colorQuip,
      defaceQuip,
      orderedColorQuip,
      luckyColorQuip,
      alphabeticalColorQuip,
      monochromeQuip,
      stealthQuip,
      fontQuip,
      timesQuip,
      defaultFontQuip,
      papyrusQuip,
      konami,
      konamiToast,
      konamiEncore,
      konamiEncoreToast,
      retroTheme,
      shortcutsOpened,
      shortcutInception,
      ownerBusinessCard,
      ownerBusinessCardText,
      ownerFix,
      ownerHelp,
      backupBackup,
      ownerSequence,
      ownerSequenceToast,
      whoamiToast,
      helpToast,
      footerPersistence,
      footerPersistenceToast,
      ownerHeadingEncore,
      ownerHeadingToast,
      offlineToast,
      onlineToast,
      ownerBadgeEncore,
      fortyTwo,
      fortyTwoToast,
    });
  });
  </script>
</body>
</html>
